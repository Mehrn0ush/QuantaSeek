[package]
name = "quanta_seek"
version = "0.1.0"
edition = "2021"
description = "TLS scanner that reports observed post-quantum key exchange and certificate algorithms"
repository = "https://github.com/Mehrn0ush/QuantaSeek"
readme = "README.md"
publish = false

[[bin]]
name = "quantaseek"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", features = ["prefer-post-quantum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
url = "2.5"
webpki-roots = "1"
x509-parser = "0.17.0"
