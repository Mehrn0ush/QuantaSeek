[package]
name = "quanta_seek"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "TLS scanner that reports observed post-quantum key exchange and certificate algorithms"
repository = "https://github.com/Mehrn0ush/QuantaSeek"
readme = "README.md"
publish = false

[[bin]]
name = "quantaseek"
path = "src/main.rs"

[features]
# Integration tests against the Docker testbed (testbed/compose.yml).
testbed = []

[dependencies]
anyhow = "1.0"
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", features = ["prefer-post-quantum"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
url = "2.5"
webpki-roots = "1"
x509-parser = "0.17.0"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
