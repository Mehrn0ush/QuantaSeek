# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained and unsound crates, and yanked versions.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Every entry here is compatible with an
# open-source, open-core or proprietary distribution of QuantaSeek, so the
# project's own license decision (see ROADMAP.md) does not depend on it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots certificate data
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# quanta_seek itself is unpublished and has no license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
