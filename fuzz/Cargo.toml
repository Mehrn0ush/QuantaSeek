[package]
name = "quanta_seek-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
quanta_seek = { path = ".." }
serde_json = "1"

# Keep the fuzz crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "server_hello"
path = "fuzz_targets/server_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate_report"
path = "fuzz_targets/certificate_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "target_parse"
path = "fuzz_targets/target_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_reply"
path = "fuzz_targets/server_reply.rs"
test = false
doc = false
bench = false
